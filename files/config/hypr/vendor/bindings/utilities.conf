# Menus — legacy distro-menu entries removed: live launcher is
# SUPER+SPACE -> rofi drun (vars.menu), SUPER+K -> keybinds-cheatsheet.sh,
# SUPER+CTRL+K -> menu-herdr-keybindings, all wired in ../../binds.lua.
# bindd = SUPER, SPACE, Launch apps, exec, walker-dmenu
# bindd = SUPER CTRL, E, Emoji picker, exec, walker-dmenu -m symbols
# bindd = SUPER CTRL, C, Capture menu, exec, nixos-menu capture
# bindd = SUPER CTRL, O, Toggle menu, exec, nixos-menu toggle
# bindd = SUPER CTRL, H, Hardware menu, exec, nixos-menu hardware
# bindd = SUPER ALT, SPACE, System menu, exec, nixos-menu
# bindd = SUPER SHIFT, code:201, System menu, exec, nixos-menu
# bindd = SUPER, ESCAPE, System menu, exec, nixos-menu system
# bindld = , XF86PowerOff, Power menu, exec, nixos-menu system
# bindd = SUPER, K, Show key bindings, exec, nixos-menu-keybindings
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
unbind = SUPER SHIFT,SPACE
unbind = SUPER SHIFT, SPACE
bindd = SUPER CTRL, SPACE, Theme background menu, exec, uwsm-app -- ~/.config/rofi/wall.sh
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, winfx transparent
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, winfx gaps
# Toggle single-window square aspect — helper not packaged on NixOS, disabled:
# bindd = SUPER CTRL, BACKSPACE, Toggle single-window square aspect, exec, nixos-hyprland-window-single-square-aspect-toggle

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
# Toggle silencing notifications — helper not packaged on NixOS, disabled:
# bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, nixos-toggle-notification-silencing
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggles
bindd = SUPER CTRL, I, Toggle locking on idle, exec, idle-toggle
bindd = SUPER CTRL, N, Toggle nightlight, exec, nightlight
bindd = SUPER CTRL, Delete, Toggle laptop display, exec, mon-toggle
# Laptop display mirroring + lid-switch helpers not packaged on NixOS, disabled:
# bindd = SUPER CTRL ALT, Delete, Toggle laptop display mirroring, exec, nixos-hyprland-monitor-internal-mirror toggle
# bindl = , switch:on:Lid Switch, exec, nixos-hw-external-monitors && nixos-hyprland-monitor-internal off
# bindl = , switch:off:Lid Switch, exec, nixos-hyprland-monitor-internal on

# Captures
bindd = , PRINT, Screenshot, exec, shot
bindd = SHIFT, PRINT, Screenshot fullscreen, exec, shot full
bindd = ALT, PRINT, Screenrecording, exec, record
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a
bindd = SUPER CTRL, PRINT, Extract text (OCR) from screenshot, exec, shot ocr

# File sharing — legacy menu removed: live bind is
# SUPER+CTRL+S -> menu-share-prompt in ../../binds.lua (kitty+gum).
# bindd = SUPER CTRL, S, Share, exec, nixos-menu share

# Transcoding — STALE: live bind is SUPER+CTRL+PERIOD -> menu-transcode-prompt in ../../binds.lua.
# bindd = SUPER CTRL, PERIOD, Transcode, exec, nixos-transcode

# Waybar-less information
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send -u low "    $(date +"%A %H:%M  ·  %d %B %Y  ·  Week %V")"
# Battery/weather status helpers not packaged on NixOS, disabled:
# bindd = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send -u low "$(nixos-battery-status)"
# bindd = SUPER CTRL ALT, W, Show weather, exec, notify-send -u low "$(nixos-weather-status)"

# Control panels
# Control panels — launchers not packaged on NixOS, disabled:
# bindd = SUPER CTRL, A, Audio controls, exec, nixos-launch-audio
# bindd = SUPER CTRL, B, Bluetooth controls, exec, nixos-launch-bluetooth
# bindd = SUPER CTRL, W, Wifi controls, exec, nixos-launch-wifi
bindd = SUPER CTRL, T, Activity, exec, uwsm-app -- ghostty -e btop

# Dictation
bindd = SUPER CTRL, X, Toggle dictation, exec, voxtype record toggle

bindd  = , F9, Start dictation (push-to-talk), exec, voxtype record start
binddr = , F9, Stop dictation (push-to-talk),  exec, voxtype record stop

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Lock system
bindd = SUPER CTRL, L, Lock system, exec, lock
