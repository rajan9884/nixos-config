# Extra autostart processes
# exec-once = uwsm-app -- my-service
exec-once = wl-paste --watch cliphist store
# Pre-render clipboard text previews in the background so the first
# SUPER+CTRL+V open serves the warm cache instead of rendering cold.
exec-once = sh -c 'ROFI_RETV=0 $HOME/.config/rofi/clipboard.sh >/dev/null 2>&1 &'
# Wallpaper is owned by awww-daemon (vendor autostart) + wallpaper-init/matugen
# on NixOS, or swww-all.sh afterwards. The old swaybg line referenced a
# ~/.config/theme/current/background path that no longer exists (and swaybg
# isn't installed) — keep it only as a guarded fallback.
exec-once = sh -c 'test -x "$(command -v swaybg)" && test -f "$HOME/.config/theme/current/background" && exec swaybg -i "$HOME/.config/theme/current/background" -m fill'
# swayosd-server is owned by its systemd user unit; never pkill it here.
# FileChooser portal backend — only when the checkout actually exists.
exec-once = sh -c 'test -x "$HOME/projects/filemanager/tools/filemanager-portal" && exec env FILEMANAGER_PORTAL_IDLE=0 "$HOME/projects/filemanager/tools/filemanager-portal"'
